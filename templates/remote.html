<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>遥控器 · 课堂</title><style>
:root{--bg:#081813;--panel:#0E2A21;--line:rgba(244,239,226,.13);--text:#F4EFE2;--muted:#9DB3A6;--amber:#D98A2B;--amber-l:#E9B45C;--jade:#2F8F73;--jade-l:#63B79A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
a{color:var(--amber-l);text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.brand{font-size:12px;letter-spacing:.12em;color:#7E978A}
.links{display:flex;gap:12px;font-size:13px;flex-wrap:wrap}
.pill{border:1px solid rgba(233,180,92,.35);color:var(--amber-l);border-radius:999px;padding:2px 10px;font-size:12px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:12px;padding:12px 14px;font-size:15px;cursor:pointer}
.btn.primary{background:rgba(217,138,43,.18);border-color:rgba(233,180,92,.55);color:#F6E4C6}
.btn.danger{border-color:rgba(200,80,60,.5);color:#F0A08E}
.btn.wide{width:100%;padding:18px;font-size:18px;margin-bottom:12px}
.card{background:linear-gradient(180deg,#0C2A21,#081813);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px}
.k{font-size:12px;letter-spacing:.12em;color:var(--muted);margin-bottom:10px}
.muted{color:var(--muted)} .small{font-size:12px}
@media(min-width:700px){body{max-width:560px;margin:0 auto;padding:16px}}
input,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;font-size:15px;font-family:inherit;margin-bottom:8px}
.control-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.control-grid .btn{width:100%;padding:10px 6px;font-size:12.5px;line-height:1.35;white-space:normal;min-height:46px}
.control-grid.cols-2{grid-template-columns:repeat(2,1fr)}
.control-grid.cols-3{grid-template-columns:repeat(3,1fr)}
</style><link rel="stylesheet" href="/ui.css" />
<link rel="stylesheet" href="/dialog.css" />
</head><body>
<div class="top"><div class="brand">YSCOT · 遥控器</div><div class="links"><span class="pill" id="room">ROOM</span><a href="/screen" target="_blank">大屏</a><a href="/ops" target="_blank">后台</a></div></div>

<div class="card"><div class="k">课堂控制</div>
  <div class="control-grid cols-2">
    <button class="btn" id="matToggle">素材发放</button>
    <button class="btn" id="hwToggle">作业提交</button>
  </div>
  <div class="control-grid cols-3">
    <button class="btn" data-view="course">大屏·课件</button>
    <button class="btn" data-view="data">大屏·数据</button>
    <button class="btn" data-view="workshop">大屏·工作坊</button>
  </div>
  <div class="k" style="margin-top:12px">大屏·数据</div>
  <div class="control-grid cols-3" id="dataTabButtons">
    <button class="btn" data-tab="base">基础信息</button>
    <button class="btn" data-tab="poll">投票结果</button>
    <button class="btn" data-tab="groups">分组情况 / 分数</button>
    <button class="btn" data-tab="homework">作业提交 / 分数</button>
    <button class="btn" data-tab="quiz">答题情况 / 分数</button>
  </div>
  <div class="k" style="margin-top:14px">小组积分</div>
  <div id="groupScores" class="small"></div>
</div>

<div class="card"><div class="k">点名</div>
  <button class="btn wide" id="rollStart">随机抽一位学员</button>
  <div id="rollName" style="margin-top:10px;font-size:24px;font-weight:800;color:var(--lime);min-height:32px"></div>
  <div class="muted small" id="rollStat">未点名</div>
  <button class="btn wide" id="rollStop" style="margin-top:8px">停止抽取</button>
</div>

<div class="card"><div class="k">投票</div>
  <select id="presetSel" style="width:100%;margin-bottom:6px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#141619;color:var(--text);font-size:14px"></select>
  <div class="muted small" id="presetHint" style="margin-bottom:8px;line-height:1.5">只用于投票；在线答题题库在「课堂后台 → 在线答题」单独导入。</div>
  <button class="btn wide" id="presetStart">开始投票</button>
  <button class="btn wide" id="pollStop">结束投票</button>
  <div class="muted small" id="pollStat">未进行</div>
</div>

<div class="card"><div class="k">抢答</div>
  <button class="btn wide" id="buzzToggle">开启抢答</button>
  <button class="btn wide" id="buzzStart">开始抢答（下一轮）</button>
  <div class="muted small" id="buzzStat">未开启</div>
  <div id="buzzWinner" style="margin-top:10px;font-size:26px;font-weight:800;color:var(--lime);min-height:34px"></div>
</div>

<div class="card"><div class="k">答题</div>
  <button class="btn wide" id="quizStart">开始答题（按题库配置）</button>
  <button class="btn wide" id="quizClose">结束答题</button>
  <div class="muted small" id="quizStat">—</div>
</div>

<div class="card"><div class="k">工作坊</div>
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><input id="wsMin" type="number" value="90" min="1" max="240" style="width:90px" /><span class="muted small">分钟</span></div>
  <button class="btn wide" id="wsStart">开始计时</button>
  <button class="btn wide" id="wsReset">重置计时</button>
  <div class="k" style="margin-top:12px">行动卡 / 场景卡</div>
  <select id="cardSel" style="margin-bottom:8px"></select>
  <button class="btn wide" id="cardPush">推送卡片</button>
  <button class="btn wide" id="cardWithdraw">撤回卡片</button>
  <div class="muted small" id="wsStat">未开始</div>
</div>
<script src="/dialog.js"></script>
<script>
var q=new URLSearchParams(location.search), ROOM=(q.get('room')||'').toUpperCase();
document.getElementById('room').textContent=ROOM||'ROOM0';
function api(p,b){var u=p+(ROOM?((p.indexOf('?')>=0?'&':'?')+'room='+ROOM):'');return fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{cache:'no-store'}).then(function(r){return r.json()})}
function post(p,b){return api(p,b)}
function refresh(){api('/api/admin/state').then(function(d){
  var cfg=d.config||{};
  var pcount=Object.keys((d.poll&&d.poll.votes)||{}).length;
  document.getElementById('pollStat').textContent=(d.poll&&d.poll.active)?('进行中 · '+pcount+' 人已投'):'未进行';
  var bz=d.buzz||{};
  window.__buzzEnabled=!!bz.enabled;
  document.getElementById('buzzStat').textContent='第 '+(bz.round||0)+' 轮 · '+(bz.running?'抢答中':(bz.enabled?'已开启':'未开启'));
  document.getElementById('buzzToggle').textContent=bz.enabled?'关闭抢答':'开启抢答';
  document.getElementById('buzzWinner').textContent=bz.winner?('抢到：'+bz.winner):'';
  document.getElementById('quizStat').textContent=(d.quiz&&d.quiz.paper&&d.quiz.paper.active)?('进行中 · '+d.quiz.answered+' 人已答'):'未发布';
  window.__mat=!!cfg.materialOpen;
  document.getElementById('matToggle').textContent='素材发放：'+(cfg.materialOpen?'已开启':'已关闭');
  window.__hw=!!(d.hwOpen!==undefined?d.hwOpen:cfg.hwOpen);
  document.getElementById('hwToggle').textContent='作业提交：'+(window.__hw?'已开启':'已关闭');
  window.__wsOpen=!!cfg.workshopOpen;
  var tm=d.timer||{};
  document.getElementById('wsStat').textContent=(tm.running?('计时中 · 剩 '+Math.max(0,Math.round((tm.endAt-Date.now())/60000))+' 分钟'):'计时未开始')+(cfg.workshopOpen?' · 卡片已推送':'');
  var wm=document.getElementById('wsMin'); if(wm&&document.activeElement!==wm){ wm.value=String(cfg.wsMinutes||90); }
  if(d.groupsEnabled===false){
    document.getElementById('groupScores').innerHTML='<span class="muted">分组抽签已关闭 · 学员按个人计分</span>';
  }else{
    var gs=(d.groups||[]).map(function(g){return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #2A2A32"><b style="width:26px">'+g.id+'</b><span style="flex:1">'+g.name+' · '+g.perf+'</span><button class="btn" data-g="'+g.id+'" data-d="-1">−1</button><button class="btn" data-g="'+g.id+'" data-d="+1</button></div>'}).join('');
    document.getElementById('groupScores').innerHTML=gs||'<span class="muted">还没有分组</span>';
  }
  var rl=d.roll||{};
  document.getElementById('rollName').textContent=rl.active?(rl.name||''):'';
  document.getElementById('rollStat').textContent=rl.active?('第 '+(rl.round||0)+' 轮 · 请该学员回答'):'未点名';
  document.getElementById('rollStart').textContent=rl.active?'重新随机抽取':'随机抽一位学员';
  var cs=document.getElementById('cardSel'); var cur=cs.value;
  cs.innerHTML='<option value="">（选择行动卡/场景卡）</option>'+(d.cards||[]).map(function(c){return '<option value="'+c.id+'">'+c.theme+' · '+c.type+'</option>'}).join('');
  if(cur)cs.value=cur;
}).catch(function(){}); loadPresets(); }
document.getElementById('rollStop').onclick=function(){post('/api/admin/roll',{action:'stop'}).then(refresh)};
document.getElementById('rollStart').onclick=function(){post('/api/admin/roll',{action:'start'}).then(function(d){ if(d&&d.ok===false)alert(d.error||'点名失败'); refresh(); })};
document.getElementById('pollStop').onclick=function(){post('/api/admin/poll',{action:'stop'}).then(refresh)};
document.getElementById('buzzToggle').onclick=function(){post('/api/admin/buzz',{action:(window.__buzzEnabled?'disable':'enable')}).then(refresh)};
document.getElementById('buzzStart').onclick=function(){post('/api/admin/buzz',{action:'start'}).then(refresh)};
document.getElementById('quizClose').onclick=function(){post('/api/admin/quiz',{action:'close'}).then(refresh)};
document.getElementById('wsStart').onclick=function(){post('/api/admin/timer',{action:'start',minutes:Number(document.getElementById('wsMin').value)||90}).then(refresh)};
document.getElementById('wsReset').onclick=function(){post('/api/admin/timer',{action:'reset'}).then(refresh)};
document.getElementById('cardPush').onclick=function(){var id=document.getElementById('cardSel').value;if(!id){alert('先在课堂后台添加行动卡');return}post('/api/admin/cards',{action:'push',id:id}).then(refresh)};
document.getElementById('cardWithdraw').onclick=function(){post('/api/admin/cards',{action:'withdraw'}).then(refresh)};
document.getElementById('groupScores').addEventListener('click',function(e){var b=e.target.closest('[data-g]');if(!b)return;post('/api/admin/perf',{group:b.getAttribute('data-g'),delta:Number(b.getAttribute('data-d'))}).then(refresh)});
var __presetSig='';
function syncPresetButton(){
  var sel=document.getElementById('presetSel'); var pb=document.getElementById('presetStart'); if(!pb||!sel)return;
  var has=!!sel.value;
  pb.disabled=!has;
  pb.textContent=has?'开始投票':'先在课堂后台添加投票题';
}
function loadPresets(){
  post('/api/admin/votepreset',{action:'list'}).then(function(d){
    var sel=document.getElementById('presetSel'); var list=(d&&d.list)||[];
    var sig=JSON.stringify(list); if(sig===__presetSig)return;
    __presetSig=sig; window.__presets=list;
    var cur=sel.value;
    sel.innerHTML='<option value="">（选择预置题目）</option>'+list.map(function(v){return '<option value="'+v.id+'">'+v.question+'</option>'}).join('');
    if(list.length) sel.value=list.some(function(v){return v.id===cur})?cur:list[0].id;
    syncPresetButton();
  }).catch(function(){});
}
document.getElementById('presetSel').onchange=syncPresetButton;
document.getElementById('presetStart').onclick=function(){var id=document.getElementById('presetSel').value;var v=(window.__presets||[]).filter(function(x){return x.id===id})[0];if(!v){alert('先在课堂后台添加预置题目');return}post('/api/admin/poll',{action:'start',question:v.question,options:v.options}).then(refresh)};
document.getElementById('quizStart').onclick=function(){post('/api/admin/quiz',{action:'startPreset'}).then(function(d){if(d&&d.ok===false)alert(d.error||'题库为空');refresh()})};
document.getElementById('matToggle').onclick=function(){post('/api/admin/material',{open:!window.__mat}).then(refresh)};
document.getElementById('hwToggle').onclick=function(){post('/api/admin/hw',{open:!window.__hw}).then(refresh)};
document.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){post('/api/admin/screen',{view:b.getAttribute('data-view')}).then(refresh)}});
document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){post('/api/admin/screen',{view:'data',tab:b.getAttribute('data-tab')}).then(refresh)}});
loadPresets();
refresh();setInterval(refresh,2500);
</script></body></html>
