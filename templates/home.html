<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>弈策课程运营系统</title>
<style>
:root{--bg:#081813;--line:rgba(244,239,226,.13);--text:#F4EFE2;--muted:#9DB3A6;--amber:#D98A2B;--amber-l:#E9B45C;--jade:#2F8F73}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
a{color:var(--amber-l);text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
.brand{font-size:13px;letter-spacing:.12em;color:#7E978A}
.user{display:flex;align-items:center;gap:10px;cursor:pointer}
.avatar{width:34px;height:34px;border-radius:50%;background:rgba(217,138,43,.25);border:1px solid rgba(233,180,92,.5);display:flex;align-items:center;justify-content:center;color:#F6E4C6;font-weight:700}
.wrap{max-width:1080px;margin:0 auto;padding:26px 24px}
h1{font-size:22px;margin-bottom:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:9px 18px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03);color:#CFDCD2;font-size:14px;cursor:pointer}
.tab.on{background:rgba(217,138,43,.16);border-color:rgba(233,180,92,.55);color:#F6E4C6}
.card{background:linear-gradient(180deg,#0C2A21,#081813);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.k{font-size:12px;letter-spacing:.12em;color:var(--muted);margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer}
.btn.primary{background:rgba(217,138,43,.18);border-color:rgba(233,180,92,.55);color:#F6E4C6}
.btn.danger{border-color:rgba(200,80,60,.5);color:#F0A08E}
input,select{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:8px 10px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.muted{color:var(--muted)} .small{font-size:12px}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.big{font-size:15px;line-height:2}
.warn{margin-top:12px;padding:10px 12px;border:1px solid rgba(255,122,61,.4);border-radius:10px;background:rgba(255,122,61,.08);color:#FFB08A;font-size:12.5px;line-height:1.7}
.warn a{color:#FFB08A;text-decoration:underline}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal-card{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.modal-card h3{font-size:18px;margin-bottom:16px}
.modal-card label{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px}
.modal-card input,.modal-card select{width:100%;margin-bottom:12px}
.modal-card .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style><link rel="stylesheet" href="/ui.css" />
<link rel="stylesheet" href="/dialog.css" />
</head><body>
<div class="top"><div class="brand">弈策课程运营系统 · YSCOT</div><div class="user" onclick="location.href='/home'"><div class="avatar" id="ava">?</div><div><div id="uname" style="font-size:14px">加载中</div><div class="small muted" id="urole"></div></div><a href="/auth/logout" onclick="event.stopPropagation()">退出</a></div></div>
<div class="wrap">
  <h1>工作台</h1>
  <div class="tabs">
    <button class="tab on" data-t="rooms">课程场次</button>
    <button class="tab" data-t="model">模型配置</button>
    <button class="tab" data-t="me">个人信息</button>
    <button class="tab hidden" data-t="teachers" id="tabTeachers">讲师管理</button>
  </div>

  <div id="pane-me">
    <div class="card"><div class="k">个人信息</div><div class="big" id="meInfo"></div><div class="warn hidden" id="dingWarn"></div></div>
    <div class="card" style="margin-top:14px">
      <div class="k">MCP 接入令牌</div>
      <p class="small muted" style="margin:6px 0 10px">给 AI Agent / MCP 客户端使用。每个讲师一套，只对当前讲师自己的场次生效；重置后旧令牌立即失效。</p>
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <input id="mcpToken" readonly autocomplete="off" style="flex:1;min-width:280px;font-family:Consolas,monospace;font-size:12px" />
        <button class="btn" id="mcpCopy">复制</button>
        <button class="btn" id="mcpReset">重置</button>
      </div>
      <div class="small muted" id="mcpMsg" style="margin-top:6px"></div>
      <div class="small" style="margin-top:6px"><a href="/mcp" target="_blank" rel="noopener">MCP 接入说明</a></div>
    </div>
  </div>

  <div id="pane-model" class="hidden">
    <div class="card"><div class="k">模型配置（课程生成、作业评分、主观题评分共用）</div>
      <div class="row"><span class="muted small">Base URL</span><input id="mBase" style="width:260px" /></div>
      <div class="row"><span class="muted small">Model</span><input id="mModel" style="width:220px" /></div>
      <div class="row"><span class="muted small">API Key</span><input id="mKey" type="password" style="width:320px" placeholder="留空不修改" /></div>
      <div class="row"><button class="btn" id="mTest">测试连通性</button><button class="btn primary" id="mSave">保存</button><span class="small muted" id="mMsg"></span></div>
    </div>
  </div>

  <div id="pane-rooms" class="hidden">
    <div class="card"><div class="k">筛选场次</div>
      <div class="row">
        <input id="fKeyword" placeholder="场次名称 / 客户项目 / 地点" style="width:280px" />
        <input id="fDate" type="date" style="width:160px" />
        <button class="btn" id="fReset">重置</button>
        <span class="small muted" id="fCount"></span>
        <span style="flex:1"></span>
        <button class="btn primary" id="newRoom">+ 新建场次</button>
      </div>
    </div>
    <div class="card"><div class="k">场次列表</div><div style="overflow:auto"><table id="roomTbl"></table></div></div>
  </div>

  <div id="pane-teachers" class="hidden">
    <div class="card"><div class="k">添加讲师</div>
      <div class="row"><input id="tName" placeholder="姓名" style="width:150px" /><select id="tRole"><option value="teacher">讲师</option><option value="admin">超管</option><option value="assistant">助教</option><option value="viewer">观察</option></select><input id="tDept" placeholder="部门" style="width:150px" /><input id="tUnion" placeholder="钉钉 unionId" style="width:240px" /><button class="btn primary" id="tAdd">添加</button><span class="small muted" id="tMsg"></span></div>
    </div>
    <div class="card"><div class="k">讲师列表</div><div style="overflow:auto"><table id="tTbl"></table></div></div>
  </div>
</div>

<script src="/dialog.js"></script>
<script>
var ME=null, ROOMS=[], TEACHERS=[];
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function show(t){
  ['me','model','rooms','teachers'].forEach(function(x){$('pane-'+x).classList.toggle('hidden',x!==t)});
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===t)});
  location.hash=t;
}
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){show(b.getAttribute('data-t'))}});
function loadMe(){
  return fetch('/api/me',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    if(!d.ok||!d.teacher){location.href='/';return}
    ME=d.teacher; if(ME.avatar){$('ava').innerHTML='<img src="'+ME.avatar+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover" />'}else{$('ava').textContent=(ME.name||'?').slice(0,1)}; $('uname').textContent=ME.name||'讲师'; $('urole').textContent=ME.role==='admin'?'超级管理员':(ME.role||'讲师');
    $('meInfo').innerHTML='姓名：'+esc(ME.name)+'<br>角色：'+esc(ME.role==='admin'?'超级管理员':ME.role)+'<br>部门：'+esc(ME.dept||'—')+(ME.title?' · '+esc(ME.title):'')+'<br>钉钉 userid：'+esc(ME.dingUserId||'—')+'<br>钉钉 unionId：'+esc(ME.dingUnionId||'—')+'<br>头像：'+(ME.avatar?'<img src="'+esc(ME.avatar)+'" style="width:40px;height:40px;border-radius:50%;vertical-align:middle" />':'—');
    if(ME.id!=='local'){
      fetch('/api/dingtalk/diag?fresh=1',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
        if(d&&d.ok)return;
        var w=document.getElementById('dingWarn'); if(!w)return;
        w.classList.remove('hidden');
        w.innerHTML='钉钉成员信息未取全'+(d&&d.errcode?('（errcode '+d.errcode+'）'):'')+'。需要在钉钉开放平台给应用开通「成员信息读权限 qyapi_get_member」'+(d&&d.applyUrl?'：<a href="'+esc(d.applyUrl)+'" target="_blank">去申请</a>':'')+'。开通后重新用钉钉登录。';
      }).catch(function(){});
    }
    if(ME.role==='admin')$('tabTeachers').classList.remove('hidden');
  });
}
function loadModel(){
  return fetch('/api/admin/state',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    var m=d.model||{}; $('mBase').value=m.baseUrl||''; $('mModel').value=m.model||''; $('mMsg').textContent=m.hasKey?'已配置':'未配置（生成会失败）';
  }).catch(function(){});
}
var CITY_DATA=[];
function loadCityData(){ return fetch('/assets/china-cities.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){ CITY_DATA=d||[]; }).catch(function(){ CITY_DATA=[]; }); }
function fillProvinces(id, selected){
  var el=document.getElementById(id); if(!el)return;
  el.innerHTML='<option value="">省份</option>'+CITY_DATA.map(function(p){return '<option value="'+p.name+'">'+p.name+'</option>'}).join('');
  if(selected) el.value=selected;
}
function fillCities(id, province, selected){
  var el=document.getElementById(id); if(!el)return;
  var pv=CITY_DATA.filter(function(p){return p.name===province})[0];
  if(!pv){ el.innerHTML='<option value="">城市</option>'; return; }
  el.innerHTML='<option value="">城市</option>'+pv.cities.map(function(c){return '<option value="'+c+'">'+c+'</option>'}).join('');
  if(selected) el.value=selected;
}
function filteredRooms(){
  var kw=($('fKeyword').value||'').trim().toLowerCase();
  var date=$('fDate').value||'';
  return ROOMS.filter(function(x){
    if(date && (x.date||'')!==date) return false;
    if(!kw) return true;
    var text=((x.title||'')+' '+(x.project||'')+' '+(x.city||'')+' '+(x.province||'')).toLowerCase();
    return text.indexOf(kw)>=0;
  });
}
function renderRooms(){
  var list=filteredRooms();
  $('fCount').textContent='共 '+list.length+' 个场次';
  var rows='<tr><th>场次码</th><th>名称</th><th>日期</th><th>地点</th><th>人数</th><th>操作</th></tr>';
  if(!list.length){ rows+='<tr><td colspan="6" class="muted small">没有符合条件的场次</td></tr>'; }
  rows+=list.map(function(x){
    return '<tr><td><b>'+x.code+'</b></td><td>'+esc(x.title)+'</td><td>'+esc(x.date||'—')+'</td><td>'+esc((x.province?x.province+' ':'')+(x.city||'—'))+'</td><td>'+x.students+'</td><td class="small">'
      +'<a href="/room?code='+x.code+'">进入</a> · <a href="/room-setup?code='+x.code+'">课程内容</a> · <button class="btn" data-edit="'+x.code+'" style="padding:2px 8px;font-size:12px">编辑</button> '+(x.code==='ROOM0'?'<span class="small muted">默认</span> <button class="btn" data-clear="'+x.code+'" style="padding:2px 8px;font-size:12px">清空</button>':'<button class="btn danger" data-del="'+x.code+'" style="padding:2px 8px;font-size:12px">删除</button>')+'</td></tr>';
  }).join('');
  $('roomTbl').innerHTML=rows;
  document.querySelectorAll('[data-edit]').forEach(function(b){b.onclick=function(){editRoom(b.getAttribute('data-edit'))}});
  document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){delRoom(b.getAttribute('data-del'))}});
  document.querySelectorAll('[data-clear]').forEach(function(b){b.onclick=function(){clearRoom(b.getAttribute('data-clear'))}});
}
function loadRooms(){
  return fetch('/api/rooms',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){ ROOMS=d.rooms||[]; renderRooms(); });
}
$('fKeyword').oninput=renderRooms;
$('fDate').onchange=renderRooms;
$('fReset').onclick=function(){ $('fKeyword').value=''; $('fDate').value=''; renderRooms(); };
function todayISO(){ var d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function provinceOptions(){ return CITY_DATA.map(function(p){return {value:p.name,label:p.name}}); }
function cityOptions(prov){ var pv=CITY_DATA.filter(function(p){return p.name===prov})[0]; return pv?pv.cities.map(function(c){return {value:c,label:c}}):[]; }
function bindCitySelect(root){
  var p=root.querySelector('[data-name="province"]'), c=root.querySelector('[data-name="city"]');
  if(!p||!c) return;
  var current=c.value;
  function fill(){
    var opts=cityOptions(p.value);
    c.innerHTML=opts.map(function(o){return '<option value="'+o.value+'">'+o.label+'</option>'}).join('');
    if(current && opts.some(function(o){return o.value===current})) c.value=current;
    current='';
  }
  p.addEventListener('change',fill); fill();
}
function openCreateRoom(){
  if(!CITY_DATA.length){ loadCityData().then(openCreateRoom); return; }
  GTSC.dialog({
    title:'新建课程场次', width:640,
    fields:[
      {name:'project',label:'客户/项目名称',required:true,full:true,placeholder:'例如：三花集团 AI 培训'},
      {name:'date',label:'日期',type:'date',value:todayISO()},
      {name:'province',label:'省份',type:'select',options:provinceOptions(),value:'浙江省'},
      {name:'city',label:'城市',type:'select',options:cityOptions('浙江省'),value:'杭州市'}
    ],
    submitText:'创建场次',
    onReady:bindCitySelect,
    onSubmit:function(v,close){
      fetch('/api/rooms/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:v.project,date:v.date,province:v.province,city:v.city})})
        .then(function(r){return r.json()}).then(function(d){ if(d.ok)location.href='/room?code='+d.code; else GTSC.alert(d.error||'创建失败'); });
      return false;
    }
  });
}
$('newRoom').onclick=openCreateRoom;
function editRoom(code){
  if(!CITY_DATA.length){ loadCityData().then(function(){editRoom(code)}); return; }
  var r=ROOMS.filter(function(x){return x.code===code})[0]||{};
  var prov=r.province||'浙江省', city=r.city||'杭州市';
  GTSC.dialog({
    title:'编辑课程场次', width:640,
    fields:[
      {name:'project',label:'客户/项目名称',required:true,full:true,value:r.project||r.city||'',placeholder:'例如：三花集团 AI 培训'},
      {name:'date',label:'日期',type:'date',value:r.date||todayISO()},
      {name:'province',label:'省份',type:'select',options:provinceOptions(),value:prov},
      {name:'city',label:'城市',type:'select',options:cityOptions(prov),value:city}
    ],
    submitText:'保存',
    onReady:bindCitySelect,
    onSubmit:function(v,close){
      fetch('/api/rooms/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code,title:'',project:v.project,date:v.date,province:v.province,city:v.city})})
        .then(function(r){return r.json()}).then(function(d){ if(d.ok){ close(); loadRooms(); } else GTSC.alert(d.error||'保存失败'); });
      return false;
    }
  });
}
function delRoom(code){
  GTSC.confirm({title:'删除场次',message:'删除场次 '+code+'？该场次的学员、投票、作业、报告都会一并删除，不可恢复。',submitText:'删除',danger:true,onConfirm:function(){
    fetch('/api/rooms/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code})}).then(function(r){return r.json()}).then(function(d){ if(d.ok)loadRooms(); else GTSC.alert(d.error||'删除失败'); });
  }});
}
function clearRoom(code){
  GTSC.confirm({title:'清空默认场次',message:'清空 '+code+' 的学员、投票、作业、分组与课堂数据？场次本身和已上传文件保留。',submitText:'清空',danger:true,onConfirm:function(){
    fetch('/api/rooms/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code})}).then(function(r){return r.json()}).then(function(d){ if(d.ok)loadRooms(); else GTSC.alert(d.error||'清空失败'); });
  }});
}
function editTeacher(id){
  var t=TEACHERS.filter(function(x){return x.id===id})[0]||{};
  GTSC.dialog({title:'编辑讲师',width:640,fields:[
    {name:'name',label:'姓名',required:true,value:t.name||''},
    {name:'role',label:'角色',type:'select',value:t.role||'teacher',options:[{value:'admin',label:'超级管理员'},{value:'teacher',label:'讲师'},{value:'assistant',label:'助教'},{value:'viewer',label:'观察'}]},
    {name:'dept',label:'部门',value:t.dept||'',full:true}
  ],submitText:'保存',onSubmit:function(v,close){
    fetch('/api/teachers/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,name:v.name,role:v.role,dept:v.dept})}).then(function(r){return r.json()}).then(function(d){ if(d.ok){ close(); loadTeachers(); } else GTSC.alert(d.error||'保存失败'); });
    return false;
  }});
}
function delTeacher(id){
  GTSC.confirm({title:'删除讲师',message:'删除该讲师账号？删除后该账号无法再登录。',submitText:'删除',danger:true,onConfirm:function(){
    fetch('/api/teachers/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})}).then(function(r){return r.json()}).then(function(d){ if(d.ok)loadTeachers(); else GTSC.alert(d.error||'删除失败'); });
  }});
}
function loadTeachers(){
  return fetch('/api/teachers',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    TEACHERS=d.teachers||[];
    $('tTbl').innerHTML='<tr><th>姓名</th><th>角色</th><th>部门</th><th>钉钉 unionId</th><th>操作</th></tr>'+TEACHERS.map(function(t){
      return '<tr><td>'+esc(t.name)+'</td><td>'+esc(t.role)+'</td><td>'+esc(t.dept||'—')+'</td><td class="small muted">'+esc(t.dingUnionId||'—')+'</td><td class="small"><button class="btn" data-tedit="'+t.id+'" style="padding:2px 8px;font-size:12px">编辑</button> <button class="btn danger" data-tdel="'+t.id+'" style="padding:2px 8px;font-size:12px">删除</button></td></tr>';
    }).join('');
    document.querySelectorAll('[data-tedit]').forEach(function(b){b.onclick=function(){editTeacher(b.getAttribute('data-tedit'))}});
    document.querySelectorAll('[data-tdel]').forEach(function(b){b.onclick=function(){delTeacher(b.getAttribute('data-tdel'))}});
  }).catch(function(){});
}
$('tAdd').onclick=function(){ fetch('/api/teachers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('tName').value,role:$('tRole').value,dept:$('tDept').value,dingUnionId:$('tUnion').value})}).then(function(r){return r.json()}).then(function(d){ if(d.ok){loadTeachers();$('tMsg').textContent='已添加'} else $('tMsg').textContent=d.error||'失败'; }); };
$('mTest').onclick=function(){ $('mMsg').textContent='测试中…'; fetch('/api/admin/model',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'test',baseUrl:$('mBase').value,model:$('mModel').value,apiKey:$('mKey').value})}).then(function(r){return r.json()}).then(function(d){ $('mMsg').textContent=d.ok?('连通正常 · '+d.model+' · '+d.ms+'ms'):('失败：'+(d.error||'')); }); };
$('mSave').onclick=function(){ fetch('/api/admin/model',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save',baseUrl:$('mBase').value,model:$('mModel').value,apiKey:$('mKey').value})}).then(function(r){return r.json()}).then(function(d){ $('mKey').value=''; $('mMsg').textContent=d.ok?'已保存':'保存失败'; loadModel(); }); };
function loadMcpToken(){
  fetch('/api/me/mcp-token',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    if(!d.ok){$('mcpMsg').textContent=d.error||'读取失败';return}
    $('mcpToken').value=d.token||''; $('mcpMsg').textContent='仅当前登录账号可见 · '+(d.updatedAt?('更新于 '+new Date(d.updatedAt).toLocaleString('zh-CN')):'');
  }).catch(function(){ $('mcpMsg').textContent='读取失败，请刷新重试'; });
}
$('mcpCopy').onclick=function(){
  var v=$('mcpToken').value; if(!v)return;
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(v).then(function(){$('mcpMsg').textContent='已复制，粘贴到 MCP 客户端的 Authorization 里'},function(){$('mcpToken').select();document.execCommand('copy');$('mcpMsg').textContent='已复制'}) }
  else { $('mcpToken').select(); document.execCommand('copy'); $('mcpMsg').textContent='已复制'; }
};
$('mcpReset').onclick=function(){
  if(!confirm('重置后旧 token 立即失效，需要把新 token 重新填到 MCP 客户端。继续？')) return;
  fetch('/api/me/mcp-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'reset'})}).then(function(r){return r.json()}).then(function(d){
    if(!d.ok){$('mcpMsg').textContent=d.error||'重置失败';return}
    $('mcpToken').value=d.token||''; $('mcpMsg').textContent='已重置：旧 token 已失效';
  }).catch(function(){ $('mcpMsg').textContent='重置失败，请重试'; });
};

</script></body></html>
