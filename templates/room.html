<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>场次入口 · YSCOT</title>
<style>
:root{--bg:#081813;--line:rgba(244,239,226,.13);--text:#F4EFE2;--muted:#9DB3A6;--amber:#D98A2B;--amber-l:#E9B45C}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:22px}
a{color:var(--amber-l);text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.brand{font-size:12px;letter-spacing:.12em;color:#7E978A}
h1{font-size:24px;margin:4px 0}
.code{font-size:42px;font-weight:800;color:#F6E4C6;letter-spacing:.18em}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}
.card{background:linear-gradient(180deg,#0C2A21,#081813);border:1px solid var(--line);border-radius:16px;padding:18px}
.k{font-size:12px;letter-spacing:.12em;color:var(--muted);margin-bottom:10px}
.linkrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.linkrow:last-child{border-bottom:0}
.linkrow .l{font-size:15px;color:#E9E4D6}
.linkrow .u{font-size:12px;color:var(--muted);word-break:break-all;margin-top:3px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:9px;padding:7px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn.primary{background:rgba(217,138,43,.18);border-color:rgba(233,180,92,.55);color:#F6E4C6}
.qr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#qrcode{background:#F4EFE2;padding:12px;border-radius:12px}
.muted{color:var(--muted)} .small{font-size:12px}
.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.cc{display:block;border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.03);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.cc:hover{transform:translateY(-4px);border-color:rgba(203,247,78,.45);box-shadow:0 16px 36px rgba(0,0,0,.45),0 0 0 1px rgba(203,247,78,.12)}
.cc b{display:block;color:#F6E4C6;margin-bottom:6px;font-size:15px}
.cc span{font-size:12px;color:var(--muted);line-height:1.6}
@media(max-width:900px){.cards4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="/ui.css" />
<link rel="stylesheet" href="/dialog.css" />
</head><body>
<div class="top"><div class="brand">YSCOT · 场次入口</div><div><a href="/home">← 场次列表</a> · <a href="/ops" id="lnkOps">课堂后台</a><button class="btn" id="delRoom" style="display:none;margin-left:8px">删除场次</button></div></div>
<h1 id="title">课堂房间</h1>
<div class="code" id="code">ROOM0</div>
<p class="muted small" style="margin-top:6px">把这个页面投屏或发给助教，所有入口和学员二维码都在这里。<span id="who" class="small" style="margin-left:10px"></span></p>
<div class="cards4">
  <a class="cc" href="/join?room=CODE" id="ccJoin"><b>学员交互端</b><span>积分 / 抽签 / 投票 / 答题 / 提交作业 / 下载素材</span></a>
  <a class="cc" href="/remote?room=CODE" id="ccRemote"><b>讲师遥控器</b><span>课件翻页 / 大屏切换 / 投票 / 素材 / 答题 / 作业 / 抢答 / 计时</span></a>
  <a class="cc" href="/ops?room=CODE" id="ccOps"><b>课堂后台</b><span>课堂管理 / 作业评分 / 在线答题（预置内容）</span></a>
  <a class="cc" href="/screen?room=CODE" id="ccScreen"><b>授课大屏</b><span>课件 / 课堂数据 / 工作坊</span></a>
</div>
<div class="grid">
  <div class="card">
    <div class="k">全部入口</div>
    <div id="links"></div>
    <div class="k" style="margin-top:18px">课程大纲文件</div><div id="roomFiles" class="small muted">加载中…</div>
  </div>
  <div class="card">
    <div class="k">学员端二维码</div>
    <div class="qr"><div id="qrcode"></div><div class="small muted" id="joinurl"></div></div>
  </div>
</div>
<script src="/qrcode.min.js"></script>
<script src="/dialog.js"></script>
<script>
var q=new URLSearchParams(location.search);
var CODE=(q.get('code')||q.get('room')||'ROOM0').toUpperCase();
document.getElementById('code').textContent=CODE;
fetch('/api/rooms',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
  var room=(d.rooms||[]).filter(function(x){return x.code===CODE})[0];
  if(room)document.getElementById('title').textContent=room.title;
}).catch(function(){});
var base=location.origin;
try{
  fetch('/api/rooms',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    var room=(d.rooms||[]).filter(function(x){return x.code===CODE})[0]||{};
    var fs=room.files||[], h='';
    if(fs.length)h=fs.map(function(f){return '<div><a href="'+f.url+'" target="_blank">'+f.name+'</a></div>'}).join('');
    else h='<span class="muted">还没有上传课程大纲文件</span>';
    if(room.frameworkUrl){h+='<div style="margin-top:6px"><a href="'+room.frameworkUrl+'" target="_blank">大纲框架页</a></div>'}
   
    document.getElementById('roomFiles').innerHTML=h;
  });
}catch(e){}
var items=[
 ['学员交互端（扫码加入）', base+'/join?room='+CODE],
 ['遥控器（讲师手机）', base+'/remote?room='+CODE],
 ['课堂后台（四标签）', base+'/ops?room='+CODE]
];
document.getElementById('links').innerHTML=items.map(function(x,i){
  return '<div class="linkrow"><div><div class="l">'+x[0]+'</div><div class="u">'+x[1]+'</div></div>'
    +'<div><a class="btn" href="'+x[1]+'" target="_blank">打开</a> <button class="btn" data-copy="'+i+'">复制</button></div></div>';
}).join('');
document.querySelectorAll('[data-copy]').forEach(function(b){b.onclick=function(){var u=items[+b.getAttribute('data-copy')][1];navigator.clipboard&&navigator.clipboard.writeText(u);b.textContent='已复制';setTimeout(function(){b.textContent='复制'},1200)}});
document.getElementById('lnkOps').href='/ops?room='+CODE;
['join','remote','ops','screen'].forEach(function(k){var el=document.getElementById('cc'+k.charAt(0).toUpperCase()+k.slice(1));if(el)el.href='/'+k+'?room='+CODE});
fetch('/api/me',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){ if(d&&d.teacher){var w=document.getElementById('who');var t=d.teacher;w.innerHTML=(t.avatar?'<img src="'+t.avatar+'" style="width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-right:5px" />':'')+'当前讲师：'+(t.name||'')+(t.role==='admin'?'（超管）':'');} }).catch(function(){});
if(CODE!=='ROOM0'){ var db=document.getElementById('delRoom'); db.style.display='inline-block'; db.onclick=function(){ GTSC.confirm({title:'删除场次',message:'删除场次 '+CODE+'？该场次全部数据将不可恢复。',submitText:'删除',danger:true,onConfirm:function(){ fetch('/api/rooms/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:CODE})}).then(function(r){return r.json()}).then(function(d){ if(d.ok)location.href='/rooms'; else GTSC.alert(d.error||'删除失败'); }); }}); }; }
var join=base+'/join?room='+CODE;
document.getElementById('joinurl').textContent=join;
new QRCode(document.getElementById('qrcode'),{text:join,width:220,height:220,colorDark:'#0A1F1A',colorLight:'#F4EFE2',correctLevel:QRCode.CorrectLevel.M});
</script></body></html>
