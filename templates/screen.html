<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>授课大屏 · YSCOT</title>
<link rel="stylesheet" href="/ui.css" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0E0E10;color:#F4F4F5;font-family:Inter,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.top{flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #2A2A32;background:rgba(14,14,16,.92)}
.brand{font-size:12px;letter-spacing:.12em;color:#6B6B76}
.links{display:flex;align-items:center;gap:14px;font-size:13px;color:#A1A1AA}
.links a{color:#A1A1AA;text-decoration:none}
.links a:hover{color:#CBF74E}
.pill{border:1px solid rgba(203,247,78,.35);color:#CBF74E;border-radius:999px;padding:2px 10px;font-size:12px}
.fs{border:1px solid #2A2A32;background:#202027;color:#F4F4F5;border-radius:9px;padding:6px 12px;font-size:12px;cursor:pointer}
.frame-wrap{flex:1;position:relative;background:#0E0E10;min-height:0}
#viewFrame{width:100%;height:100%;border:0;background:#0E0E10}
.empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center;padding:30px}
.empty.show{display:flex}
.empty b{font-size:20px;color:#F4F4F5}
.empty span{font-size:13px;color:#A1A1AA;max-width:520px;line-height:1.8}
.workshop{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:4vh 6vw;text-align:center;background:radial-gradient(120% 90% at 50% 0,#16352A,#0E0E10 58%)}
.workshop.show{display:flex}
.ws-kicker{font-size:12px;letter-spacing:.3em;color:#6B6B76}
.ws-clock{font-size:clamp(96px,19vw,260px);font-weight:900;line-height:.95;letter-spacing:-.05em;color:#CBF74E;font-variant-numeric:tabular-nums}
.ws-status{font-size:clamp(14px,1.6vw,22px);color:#A1A1AA}
.ws-card{max-width:900px;border:1px solid rgba(203,247,78,.35);border-radius:24px;padding:18px 24px;background:rgba(203,247,78,.06);color:#F4F4F5;line-height:1.7;font-size:clamp(13px,1.3vw,18px)}
.ws-card b{display:block;font-size:clamp(18px,2.2vw,30px);color:#CBF74E;margin-bottom:6px}
.ws-card .attrs{color:#A1A1AA;font-size:.85em;margin-top:6px}
.ws-empty{color:#6B6B76;font-size:clamp(14px,1.4vw,20px)}
.ws-foot{font-size:12px;color:#6B6B76;letter-spacing:.08em}
.pollview{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;justify-content:center;padding:5vh 7vw;background:radial-gradient(120% 90% at 50% 0,#1A3328,#0E0E10 62%)}
.pollview.show{display:flex}
.poll-kicker{font-size:12px;letter-spacing:.3em;color:#6B6B76;margin-bottom:2vh}
.poll-q{font-size:clamp(24px,3.5vw,54px);font-weight:800;line-height:1.35;color:#F4F4F5;margin-bottom:5vh;max-width:1200px}
.poll-bars{display:flex;flex-direction:column;gap:1.8vh;max-width:1200px}
.poll-row{display:flex;flex-direction:column;gap:6px}
.poll-row .lab{display:flex;justify-content:space-between;font-size:clamp(14px,1.5vw,22px);color:#D4D4D8}
.poll-row .lab b{font-variant-numeric:tabular-nums;color:#CBF74E}
.poll-track{height:clamp(14px,1.6vw,24px);border-radius:99px;background:#27272A;overflow:hidden}
.poll-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#9EDC2F,#CBF74E);transition:width .5s ease}
.poll-meta{font-size:clamp(13px,1.3vw,18px);color:#A1A1AA;margin-top:3vh}
.dataView{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;padding:90px 5vw 3vh;background:radial-gradient(120% 90% at 50% 0,#16352A,#0E0E10 60%);overflow:auto}
.dataView.show{display:flex}
.data-tabs{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:5px;align-items:center;padding:6px;border:1px solid rgba(244,244,245,.14);border-radius:999px;background:rgba(20,24,22,.58);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 14px 44px rgba(0,0,0,.28);max-width:94vw;overflow:auto;z-index:6}
.data-tab{border:0;background:transparent;color:#A1A1AA;font-family:inherit;font-size:clamp(11px,1vw,14px);font-weight:700;padding:8px clamp(10px,1.4vw,18px);border-radius:999px;white-space:nowrap;cursor:default}
.data-tab.on{background:#CBF74E;color:#101410;box-shadow:0 0 24px rgba(203,247,78,.18)}
.data-body{flex:1;min-height:0;display:flex;align-items:center}
.data-panel{width:100%;animation:dataIn .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes dataIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.data-kicker{font-size:12px;letter-spacing:.3em;color:#6B6B76;margin-bottom:1.4vh}
.data-h1{font-size:clamp(28px,4vw,64px);font-weight:900;line-height:1.1;letter-spacing:-.03em;margin-bottom:1vh}
.data-sub{font-size:clamp(13px,1.4vw,20px);color:#A1A1AA;margin-bottom:4vh}
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:2vh 0 3vh}
.stat-card{border:1px solid rgba(203,247,78,.2);border-radius:16px;padding:14px 16px;background:rgba(203,247,78,.045)}
.stat-card b{display:block;font-size:clamp(22px,2.8vw,42px);color:#CBF74E;line-height:1.1;font-variant-numeric:tabular-nums}
.stat-card span{display:block;color:#A1A1AA;font-size:clamp(11px,1vw,14px);margin-top:4px}
.data-list{display:flex;flex-direction:column;gap:1.2vh;max-width:1200px}
.data-row{display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(244,244,245,.10);padding:1vh 0}
.data-row .num{font-size:clamp(18px,2vw,30px);font-weight:900;color:#CBF74E;min-width:54px;font-variant-numeric:tabular-nums}
.data-row .name{flex:1;font-size:clamp(13px,1.4vw,20px);color:#F4F4F5}
.data-row .tag{font-size:clamp(11px,1vw,14px);color:#A1A1AA}
.data-note{font-size:clamp(12px,1.2vw,16px);color:#A1A1AA;margin-top:2vh;line-height:1.7}
</style></head><body>
<div class="top">
  <div class="brand">YSCOT · 授课大屏</div>
  <div class="links"><span class="pill" id="room">ROOM0</span><a id="backLink" href="#">场次入口</a><a id="remoteLink" href="#">遥控器</a><button class="fs" id="fs">全屏</button></div>
</div>
<div class="frame-wrap">
  <iframe id="viewFrame" title="大屏内容"></iframe>
  <div class="workshop" id="workshopView">
  <div class="ws-kicker">YSCOT · 工作坊</div>
  <div class="ws-clock" id="wsClock">--:--</div>
  <div class="ws-status" id="wsStatus">等待开始计时</div>
  <div class="ws-card" id="wsCard"><span class="ws-empty">暂无行动卡 / 场景卡</span></div>
  <div class="ws-foot">遥控器 → 工作坊 → 开始计时 / 推送行动卡</div>
</div>
  <div class="dataView" id="dataView">
    <div class="data-tabs" id="dataTabs"></div>
    <div class="data-body" id="dataBody"></div>
  </div>
  <div class="pollview" id="pollView">
    <div class="poll-kicker">YSCOT · 投票结果</div>
    <div class="poll-q" id="pollQ">暂无投票</div>
    <div class="poll-bars" id="pollBars"></div>
    <div class="poll-meta" id="pollMeta"></div>
  </div>
  <div class="empty" id="empty"><b id="emptyTitle">还没有内容</b><span id="emptyMsg"></span></div>
</div>
<script>
var q=new URLSearchParams(location.search), room=(q.get('room')||'ROOM0').toUpperCase();
document.getElementById('room').textContent=room;
document.getElementById('backLink').href='/room?code='+room;
document.getElementById('remoteLink').href='/remote?room='+room;
document.getElementById('fs').onclick=function(){ if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen(); };
var lastSrc='', wsEnd=0, wsRunning=false;

function setFrame(src,title,msg){
  var f=document.getElementById('viewFrame'), e=document.getElementById('empty');
  if(!src){ if(f.getAttribute('src'))f.removeAttribute('src'); f.style.display='none'; e.classList.add('show'); document.getElementById('emptyTitle').textContent=title||'还没有内容'; document.getElementById('emptyMsg').textContent=msg||''; return; }
  e.classList.remove('show'); f.style.display='block';
  if(lastSrc!==src){ lastSrc=src; f.src=src; }
}
function showWorkshop(d){
  var w=document.getElementById('workshopView'), f=document.getElementById('viewFrame'), e=document.getElementById('empty');
  w.classList.add('show'); f.style.display='none'; e.classList.remove('show');
  var tm=d.timer||{}; wsEnd=Number(tm.endAt)||0; wsRunning=!!tm.running;
  var st=document.getElementById('wsStatus');
  st.textContent=wsRunning?'倒计时进行中':(wsEnd?'已暂停':'等待开始计时');
  var box=document.getElementById('wsCard'), c=d.activeCardData;
  if(c){ box.innerHTML='<b>'+esc(c.theme||'')+'</b>'+(c.type?('<span style="color:#A1A1AA">'+esc(c.type)+'</span><br>'):'')+esc(c.content||'')+(c.attrs?('<div class="attrs">'+esc(c.attrs)+'</div>'):''); }
  else{ box.innerHTML='<span class="ws-empty">暂无行动卡 / 场景卡</span>'; }
  tickClock();
}
function showPoll(d){
  var pv=document.getElementById('pollView'), f=document.getElementById('viewFrame'), e=document.getElementById('empty');
  pv.classList.add('show'); f.style.display='none'; e.classList.remove('show');
  var p=d.poll||{}, opts=p.options||[], res=p.results||{}, total=Number(p.count)||0;
  document.getElementById('pollQ').textContent=p.question||'暂无投票';
  var max=1; opts.forEach(function(o,i){max=Math.max(max,Number(res[i]||0))});
  document.getElementById('pollBars').innerHTML=opts.length?opts.map(function(o,i){
    var n=Number(res[i]||0), pct=total?Math.round(n/total*100):0, w=Math.round(n/max*100);
    return '<div class="poll-row"><div class="lab"><span>'+esc(o)+'</span><span><b>'+n+'</b> 票 · '+pct+'%</span></div><div class="poll-track"><div class="poll-fill" style="width:'+w+'%"></div></div></div>';
  }).join(''):'<div class="poll-meta">还没有投票选项</div>';
  document.getElementById('pollMeta').textContent='已投 '+total+' 人'+(p.active?' · 进行中':' · 已结束');
}
function hidePoll(){ document.getElementById('pollView').classList.remove('show'); }
function hideWorkshop(){ document.getElementById('workshopView').classList.remove('show'); }
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function tickClock(){
  var el=document.getElementById('wsClock'), st=document.getElementById('wsStatus');
  if(!wsEnd && !wsRunning){ el.textContent='--:--'; return; }
  if(!wsRunning){ el.textContent='--:--'; if(st)st.textContent='等待开始计时'; return; }
  var left=Math.max(0,wsEnd-Date.now());
  var sec=Math.ceil(left/1000), m=Math.floor(sec/60), ss=sec%60;
  el.textContent=pad(m)+':'+pad(ss);
  if(left<=0 && st) st.textContent='时间到';
  else if(st) st.textContent='倒计时进行中';
}
setInterval(tickClock,250);

function tabButtons(active){
  var tabs=[['base','基础信息'],['poll','投票结果'],['groups','分组情况 / 分数'],['homework','作业提交 / 分数'],['quiz','答题情况 / 分数']];
  return tabs.map(function(t){return '<span class="data-tab'+(t[0]===active?' on':'')+'">'+t[1]+'</span>'}).join('');
}
function pollPanel(d){
  var p=d.poll||{},opts=p.options||[],res=p.results||{},total=Number(p.count)||0,max=1;
  opts.forEach(function(o,i){max=Math.max(max,Number(res[i]||0))});
  return '<div class="data-kicker">YSCOT · 投票结果</div><div class="data-h1">'+(p.question?esc(p.question):'暂无投票')+'</div><div class="data-sub">已投 '+total+' 人'+(p.active?' · 进行中':' · 已结束')+'</div>'+
    '<div class="poll-bars">'+(opts.length?opts.map(function(o,i){var n=Number(res[i]||0),pct=total?Math.round(n/total*100):0,w=Math.round(n/max*100);return '<div class="poll-row"><div class="lab"><span>'+esc(o)+'</span><span><b>'+n+'</b> 票 · '+pct+'%</span></div><div class="poll-track"><div class="poll-fill" style="width:'+w+'%"></div></div></div>'}).join(''):'<div class="data-note">还没有投票选项</div>')+'</div>';
}
function basePanel(d){
  var m=d.meta||{},q=d.quiz||{};
  return '<div class="data-kicker">YSCOT · 课堂数据</div><div class="data-h1">'+esc(d.title||m.title||('课堂 '+d.room))+'</div><div class="data-sub">'+esc([m.date,m.city||m.province,m.project].filter(Boolean).join(' · ')||('房间 '+d.room))+'</div>'+
    '<div class="stat-grid"><div class="stat-card"><b>'+d.students+'</b><span>在场学员</span></div><div class="stat-card"><b>'+(d.groupsEnabled?'分组':'个人')+'</b><span>计分模式</span></div><div class="stat-card"><b>'+(d.homework?d.homework.count:0)+'</b><span>作业提交</span></div><div class="stat-card"><b>'+(q.answered||0)+'</b><span>答题人数</span></div></div>'+
    '<div class="data-list">'+
      '<div class="data-row"><span class="name">场次码</span><span class="tag"><b>'+esc(d.room)+'</b></span></div>'+
      '<div class="data-row"><span class="name">日期</span><span class="tag">'+esc(m.date||'—')+'</span></div>'+
      '<div class="data-row"><span class="name">地点</span><span class="tag">'+esc([m.province,m.city].filter(Boolean).join(' '))+'</span></div>'+
      '<div class="data-row"><span class="name">客户 / 项目</span><span class="tag">'+esc(m.project||m.title||'—')+'</span></div>'+
      '<div class="data-row"><span class="name">作业提交</span><span class="tag">'+(d.hwOpen?'已开启':'未开启')+' · '+(d.reviewEnabled?'评审开启':'评审关闭')+'</span></div>'+
      '<div class="data-row"><span class="name">投票 / 抢答 / 答题</span><span class="tag">'+(d.poll&&d.poll.active?'投票进行中':'投票未进行')+' · '+(d.buzz&&d.buzz.winner?('抢答 '+esc(d.buzz.winner)):'抢答未开始')+' · '+(q.active?'答题进行中':'答题未发布')+'</span></div>'+
    '</div>';
}
function groupsPanel(d){
  if(d.groupsEnabled===false){
    var rows=(d.individualTop||[]).map(function(s,i){return '<div class="data-row"><span class="num">'+(i+1)+'</span><span class="name">'+esc(s.name)+' <span class="tag">'+esc(s.tail||'')+'</span></span><span class="tag">个人 '+s.individualScore+' 分 · 抢答 '+s.buzzes+' 次</span></div>'}).join('');
    return '<div class="data-kicker">YSCOT · 个人计分</div><div class="data-h1">个人积分榜</div><div class="data-sub">分组抽签已关闭，按个人计分</div><div class="data-list">'+(rows||'<div class="data-note">还没有学员</div>')+'</div>';
  }
  var gs=(d.groups||[]).slice().sort(function(a,b){return (b.perf||0)-(a.perf||0)});
  var rows=gs.map(function(g){return '<div class="data-row"><span class="num">'+(g.perf||0)+'</span><span class="name">'+esc(g.id)+' 组 <span class="tag">'+g.count+' 人</span></span><span class="tag">'+esc(g.name||'')+'</span></div>'}).join('');
  return '<div class="data-kicker">YSCOT · 分组情况</div><div class="data-h1">小组积分榜</div><div class="data-sub">表现分 + 作业分 · 按小组累计</div><div class="data-list">'+(rows||'<div class="data-note">还没有分组</div>')+'</div>';
}
function homeworkPanel(d){
  var hw=d.homework||{byTask:[]}; var cards='<div class="stat-grid"><div class="stat-card"><b>'+hw.count+'</b><span>提交份数</span></div><div class="stat-card"><b>'+(d.reviewEnabled?'开启':'关闭')+'</b><span>作业评审</span></div><div class="stat-card"><b>'+d.hwCount+'</b><span>启用作业数</span></div><div class="stat-card"><b>'+hw.total+'</b><span>当前总分</span></div></div>';
  var rows=(hw.byTask||[]).map(function(t){return '<div class="data-row"><span class="name">'+esc(t.id+' '+t.title)+'</span><span class="tag">'+t.count+' 份 · 已评 '+t.scored+' · 均分 '+t.avg+'</span></div>'}).join('');
  return '<div class="data-kicker">YSCOT · 作业提交</div><div class="data-h1">作业提交与分数</div><div class="data-sub">'+(d.reviewEnabled?'按评分标准统计':'评审已关闭，仅保存提交')+'</div>'+cards+'<div class="data-list">'+(rows||'<div class="data-note">还没有提交</div>')+'</div>';
}
function quizPanel(d){
  var q=d.quiz;
  if(!q) return '<div class="data-kicker">YSCOT · 在线答题</div><div class="data-h1">答题情况</div><div class="data-sub">还没有发布答题</div>';
  var cards='<div class="stat-grid"><div class="stat-card"><b>'+q.answered+'</b><span>已答人数</span></div><div class="stat-card"><b>'+q.avg+'</b><span>平均分</span></div><div class="stat-card"><b>'+q.count+'</b><span>题目数</span></div><div class="stat-card"><b>'+q.points+'</b><span>满分</span></div></div>';
  var rows=(q.top||[]).map(function(s,i){return '<div class="data-row"><span class="num">'+(i+1)+'</span><span class="name">'+esc(s.name)+' <span class="tag">'+esc(s.tail||'')+'</span></span><span class="tag">'+(s.score||0)+' / '+(s.total||0)+'</span></div>'}).join('');
  return '<div class="data-kicker">YSCOT · 答题情况</div><div class="data-h1">在线答题</div><div class="data-sub">答题分数与排名</div>'+cards+'<div class="data-list">'+(rows||'<div class="data-note">还没有提交</div>')+'</div>';
}
function showData(d){
  var dv=document.getElementById('dataView'),f=document.getElementById('viewFrame'),e=document.getElementById('empty');
  var tab=(d.screenDataTab||'base'); if(['base','poll','groups','homework','quiz'].indexOf(tab)<0)tab='base';
  document.getElementById('dataTabs').innerHTML=tabButtons(tab);
  var body=tab==='base'?basePanel(d):tab==='poll'?pollPanel(d):tab==='groups'?groupsPanel(d):tab==='homework'?homeworkPanel(d):quizPanel(d);
  document.getElementById('dataBody').innerHTML='<div class="data-panel">'+body+'</div>';
  dv.classList.add('show'); f.style.display='none'; e.classList.remove('show');
}
function hideData(){document.getElementById('dataView').classList.remove('show')}
function refresh(){
  fetch('/api/screen?room='+room,{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    var view=d.screenView||'data';
    if(view==='data'||view==='poll'||view==='report'||view==='stats'){ hideWorkshop(); hidePoll(); showData(d); return; }
    if(view==='workshop'){ hideData(); hidePoll(); showWorkshop(d); return; }
    hideData(); hideWorkshop(); hidePoll();
    if(view==='course'){
      setFrame('/course-screen?room='+room+'&embed=1','','');
    }
  }).catch(function(){});
}
refresh(); setInterval(refresh,2500);
</script></body></html>
